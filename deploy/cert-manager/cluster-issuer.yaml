# Let's Encrypt issuer for the VPS (optional: only needed with ingress.tls.enabled=true).
# Install cert-manager first (see docs/vps.md), set your email, then:
#   kubectl apply -f deploy/cert-manager/cluster-issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com   # <-- change me
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
