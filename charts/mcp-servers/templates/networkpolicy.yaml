{{- if .Values.networkPolicy.enabled }}
# Default deny for the whole namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# MCP servers accept traffic only from the gateway pods. This is what makes
# woo-mcp unreachable from outside the cluster and from every other workload.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-from-gateway-only
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.gateway.podLabels | nindent 14 }}
---
# woo-mcp may only talk to WordPress (port 80) in the store namespace.
# It cannot reach MariaDB, the gateway's Postgres, or the internet.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp-egress
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
  policyTypes: [Egress]
  egress:
    {{- include "mcp.dnsEgress" . | nindent 4 }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.wooMcp.store.namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress
      ports:
        - port: 80
---
# server-everything needs no network access of its own.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: everything-mcp-egress
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: everything-mcp
  policyTypes: [Egress]
  egress:
    {{- include "mcp.dnsEgress" . | nindent 4 }}
{{- end }}
