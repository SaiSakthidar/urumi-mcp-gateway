# Replace <VPS_IP> / <GHCR_USER>. Pin tags to a released version.
domain: <VPS_IP>.sslip.io
scheme: https
ingress:
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
persistence:
  storageClass: local-path
gateway:
  image:
    repository: ghcr.io/<GHCR_USER>/urumi-gateway
    tag: "0.1.0"
dashboard:
  image:
    repository: ghcr.io/<GHCR_USER>/urumi-dashboard
    tag: "0.1.0"
