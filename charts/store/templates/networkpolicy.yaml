# MariaDB accepts connections only from WordPress and the setup Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-wordpress
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: store-setup
      ports:
        - port: 3306
