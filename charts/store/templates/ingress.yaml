apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  labels:
    {{- include "store.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ include "store.host" . }}]
      secretName: storefront-tls
  {{- end }}
  rules:
    - host: {{ include "store.host" . }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wordpress
                port:
                  name: http
