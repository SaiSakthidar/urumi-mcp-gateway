apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/name: woo-mcp
spec:
  type: ClusterIP   # internal only; there is deliberately no Ingress
  selector:
    app.kubernetes.io/name: woo-mcp
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    app.kubernetes.io/name: woo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
  template:
    metadata:
      labels:
        {{- include "mcp.labels" . | nindent 8 }}
        app.kubernetes.io/name: woo-mcp
    spec:
      automountServiceAccountToken: false
      containers:
        - name: woo-mcp
          image: "{{ .Values.wooMcp.image.repository }}:{{ .Values.wooMcp.image.tag }}"
          imagePullPolicy: {{ .Values.wooMcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: WC_BASE_URL
              value: {{ .Values.wooMcp.store.baseUrl | quote }}
            - name: WC_PUBLIC_HOST
              # Host header and OAuth signature host: must equal the store's WP_HOME host exactly, port included.
              value: "{{ .Values.wooMcp.store.publicHost }}{{ if .Values.wooMcp.store.publicPort }}:{{ .Values.wooMcp.store.publicPort }}{{ end }}"
            - name: STORE_TIMEZONE
              value: {{ .Values.wooMcp.store.timezone | quote }}
            - name: WC_CONSUMER_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.wooMcp.secretName }}, key: wc-consumer-key }
            - name: WC_CONSUMER_SECRET
              valueFrom:
                secretKeyRef: { name: {{ .Values.wooMcp.secretName }}, key: wc-consumer-secret }
            - name: MCP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.wooMcp.secretName }}, key: mcp-token }
          # Probes check this process only, not WooCommerce: a store outage must
          # show up as tool errors / gateway status, not as restart loops here.
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.wooMcp.resources | nindent 12 }}
          securityContext:
            {{- include "mcp.containerSecurityContext" . | nindent 12 }}
