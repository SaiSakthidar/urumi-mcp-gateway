# Defaults. Environment differences go in values-local.yaml / values-prod.yaml.

networkPolicy:
  enabled: true

# Where the gateway runs. Only pods matching this may call the MCP servers.
gateway:
  namespace: platform
  podLabels:
    app.kubernetes.io/name: gateway

wooMcp:
  image:
    repository: urumi/woo-mcp
    tag: dev
    pullPolicy: IfNotPresent
  # Created by scripts/create-secrets.sh. Keys: wc-consumer-key, wc-consumer-secret, mcp-token
  secretName: woo-mcp
  store:
    # In-cluster WordPress Service, plus the store's public host (its WP_HOME):
    # sent as Host header and used for OAuth signatures.
    baseUrl: http://wordpress.store.svc.cluster.local
    publicHost: shop.127.0.0.1.sslip.io
    # Only when the store's ingress is on a non-default port (match the store release's `port`).
    publicPort: ""
    namespace: store
    timezone: Asia/Kolkata
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }

everything:
  enabled: true
  image:
    repository: urumi/everything-mcp
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
