# nginx-unprivileged listens on 8080 as a non-root user.
server {
  listen 8080;
  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # SPA: unknown paths fall back to index.html.
  location / {
    try_files $uri /index.html;
  }
}
