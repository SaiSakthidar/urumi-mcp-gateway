apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: dashboard
spec:
  selector:
    app.kubernetes.io/name: dashboard
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: dashboard
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            runAsUser: 101   # nginx-unprivileged
            {{- include "platform.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp   # nginx writes its pid and cache files here
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
