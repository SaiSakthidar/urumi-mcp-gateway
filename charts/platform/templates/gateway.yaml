apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: gateway
spec:
  # More than one replica works: MCP is stateless (no sessions), rate-limit counters, sessions,
  # OAuth tokens and the audit log live in Postgres, and each replica runs its own health
  # poller, so upstream status converges on every pod.
  replicas: {{ .Values.gateway.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        {{- include "platform.labels" . | nindent 8 }}
        app.kubernetes.io/name: gateway
    spec:
      automountServiceAccountToken: false
      {{- if gt (int .Values.gateway.replicas) 1 }}
      # Spread replicas over nodes when there is more than one.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: gateway
      {{- end }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Used for invite links and the MCP URL shown in the dashboard; https also turns on Secure cookies.
            - name: PUBLIC_URL
              value: "{{ .Values.scheme }}://{{ include "platform.host" . }}{{ if .Values.port }}:{{ .Values.port }}{{ end }}"
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: {{ .Values.postgres.database }}
            - name: PGUSER
              value: {{ .Values.postgres.user }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.secretName }}, key: password }
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.gateway.secretName }}, key: encryption-key }
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.gateway.bootstrapAdminEmail | quote }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.gateway.secretName }}, key: bootstrap-admin-password }
            - name: SEED_WOO_MCP_URL
              value: {{ .Values.gateway.seedWooMcpUrl | quote }}
            - name: SEED_WOO_MCP_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ .Values.gateway.secretName }}, key: woo-mcp-token }
            - name: UPSTREAM_CALL_TIMEOUT_MS
              value: {{ .Values.gateway.upstreamCallTimeoutMs | quote }}
            - name: ALLOWED_INTERNAL_HOSTS
              value: {{ join "," .Values.gateway.allowedInternalHosts | quote }}
            - name: STORE_TIMEZONE
              value: {{ .Values.gateway.storeTimezone | quote }}
            - name: HEALTH_POLL_INTERVAL_MS
              value: {{ .Values.gateway.healthPollIntervalMs | quote }}
            - name: RATE_LIMIT_PER_MINUTE
              value: {{ .Values.gateway.rateLimitPerMinute | quote }}
            - name: TOOL_SEARCH_THRESHOLD
              value: {{ .Values.gateway.toolSearchThreshold | quote }}
            - name: HOSTED_NAMESPACE
              value: {{ .Values.provisioner.hostedNamespace | quote }}
            - name: HOSTED_IMAGE_REGISTRIES
              value: {{ join "," .Values.gateway.hostedImageRegistries | quote }}
            - name: MAX_STORES_PER_USER
              value: {{ .Values.gateway.maxStoresPerUser | quote }}
            - name: MAX_STORES_TOTAL
              value: {{ .Values.gateway.maxStoresTotal | quote }}
            - name: LLM_BASE_URL
              value: {{ .Values.gateway.llm.baseUrl | quote }}
            - name: LLM_MODEL
              value: {{ .Values.gateway.llm.model | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: { name: {{ .Values.gateway.secretName }}, key: llm-api-key }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext:
            runAsUser: 1000
            {{- include "platform.containerSecurityContext" . | nindent 12 }}
{{- if gt (int .Values.gateway.replicas) 1 }}
---
# Keeps at least one gateway pod serving during node drains and upgrades.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  labels:
    {{- include "platform.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
{{- end }}
