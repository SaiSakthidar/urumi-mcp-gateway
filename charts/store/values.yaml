# Defaults. Environment differences go in values-local.yaml / values-prod.yaml.

# Base domain. Storefront is served at <hostPrefix>.<domain> (default shop.<domain>).
# Provisioned stores get hostPrefix "shop-<slug>" so every store has its own host.
hostPrefix: shop
domain: 127.0.0.1.sslip.io
scheme: http
# Only set when the ingress is not on the default port for the scheme (e.g. 8080 when port 80 is taken locally).
port: ""

ingress:
  className: traefik
  tls:
    enabled: false
    # cert-manager ClusterIssuer; only used when tls.enabled=true
    clusterIssuer: ""

persistence:
  storageClass: ""   # "" = cluster default

networkPolicy:
  # Default-deny NetworkPolicies + explicit allows. Set false only to debug a CNI
  # that doesn't support NetworkPolicy.
  enabled: true
  # Where the ingress controller runs: Traefik in "traefik" on kind, "kube-system" on k3s.
  ingressController:
    namespace: traefik
    podLabels:
      app.kubernetes.io/name: traefik
  mcpNamespace: mcp

# Secrets are created out-of-band by scripts/create-secrets.sh, never by this chart.
secrets:
  db: store-db          # keys: root-password, password
  admin: store-admin    # keys: admin-password
  wcApi: store-wc-api   # keys: consumer-key, consumer-secret

mariadb:
  image: mariadb:11.8
  database: wordpress
  user: wordpress
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }

wordpress:
  image: wordpress:7.1-php8.3-apache
  storage: 2Gi
  adminUser: admin
  adminEmail: admin@urumi.local
  siteTitle: Urumi Store
  timezone: Asia/Kolkata
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 512Mi }

# Post-install/upgrade Job that turns a blank WordPress into a working store.
# Every step is idempotent, so it is safe to re-run on each `helm upgrade`.
setup:
  # Must match the PHP version of the WordPress image. Runs as www-data (uid 33)
  # so files it writes are owned the same way as in the WordPress container.
  image: wordpress:cli-2.12-php8.3
  woocommerce:
    version: ""            # "" = latest stable; pin e.g. "10.3.0" for reproducible installs
    country: IN:TN         # store base location (country:state)
    currency: INR
  seedProducts:
    - { name: "Urumi T-Shirt", price: "499" }
    - { name: "Urumi Mug", price: "299" }
    - { name: "Urumi Sticker Pack", price: "99" }
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 1000m, memory: 512Mi }

# A WooCommerce MCP server inside this store's own namespace. Off for the main store (it is
# deployed by charts/mcp-servers); on for provisioned stores, so each store is self-contained
# and its MCP server can only reach its own WordPress.
wooMcp:
  enabled: false
  image:
    repository: urumi/woo-mcp
    tag: dev
    pullPolicy: IfNotPresent
  # Created by the provisioner. Keys: wc-consumer-key, wc-consumer-secret, mcp-token
  secretName: woo-mcp
  timezone: Asia/Kolkata
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 256Mi }
  # Where the gateway runs: the only pods allowed to call this MCP server.
  gateway:
    namespace: platform
    podLabels:
      app.kubernetes.io/name: gateway

# Per-store guardrails: a store cannot use more than this, however it is configured.
quota:
  enabled: false
  requestsCpu: "2"
  requestsMemory: 3Gi
  limitsCpu: "4"
  limitsMemory: 5Gi
  pods: "12"
  persistentVolumeClaims: "4"
  requestsStorage: 10Gi
