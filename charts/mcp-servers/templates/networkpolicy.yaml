# MCP servers in this namespace accept traffic only from the gateway pods.
# This is what makes woo-mcp unreachable from outside the cluster and from
# every other workload inside it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-servers-from-gateway-only
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.gateway.namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.gateway.podLabels | nindent 14 }}
